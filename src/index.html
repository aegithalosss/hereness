<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在呢 | Hereness</title>
    <link rel="stylesheet" href="rig.css" />
    <link rel="stylesheet" href="ds-badge.css" />
    <link rel="stylesheet" href="bubble.css" />
    <style>

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 6px;
        box-sizing: border-box;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }

      #pet,
      #pet img,
      #label {
        pointer-events: none;
      }

      :root {
        --pet-size: 200px;
      }
      #pet {
        width: var(--pet-size);
        height: var(--pet-size);

        transform-origin: var(--pivot-x, 50%) var(--pivot-y, 100%);
      }

      #pet-art {
        position: relative;
        width: 100%;
        height: 100%;
        transform-origin: var(--pivot-x, 50%) var(--pivot-y, 100%);
      }
      #pet-art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 50% 100%;
      }

      #pet-art .pet-fx {
        position: absolute;
        inset: 0;
        background: no-repeat 50% 100% / contain;
        -webkit-mask: no-repeat 50% 100% / contain;
        mask: no-repeat 50% 100% / contain;
        pointer-events: none;
      }

      #pet-shadow-wrap {
        position: absolute;
        inset: 0;

        transform-origin: var(--grab-origin-x, 50%) var(--grab-origin-y, 15%);
        pointer-events: none;
      }
      #pet-shadow {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 50% 100%;

        transform-origin: 50% 83%;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      [hidden] {
        display: none !important;
      }

      #pet-emoji {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 96px;
        line-height: 1;
      }

      #bottom-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        max-width: 100%;
        margin-top: 2px;
      }

      #label {
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(20, 20, 24, 0.75);
        color: #fff;
        font: 12px/1.4 "Microsoft YaHei", system-ui, sans-serif;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
      }
      #label-text {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #skin-hint {
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(150, 40, 40, 0.85);
        color: #fff;
        cursor: pointer;
        font: 12px/1.4 "Microsoft YaHei", system-ui, sans-serif;
        white-space: nowrap;
      }

      .pop {
        animation: pop 0.25s ease-out;
      }
      @keyframes pop {
        0% { transform: scale(0.9, 1.08); }
        60% { transform: scale(1.04, 0.97); }
        100% { transform: scale(1, 1); }
      }

      .m-breathe { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.01, 1.03); }
      }

      .m-hop { animation: hop 1.6s ease-in-out infinite; }
      @keyframes hop {
        0%, 55%, 100% { transform: translateY(0) scale(1, 1); }
        62% { transform: translateY(0) scale(1.06, 0.94); }
        75% { transform: translateY(-14px) scale(0.97, 1.04); }
        88% { transform: translateY(0) scale(1.04, 0.96); }
      }

      .m-tilt { animation: tilt 2.4s ease-in-out infinite; }
      @keyframes tilt {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      .m-rock { animation: rock 3.2s ease-in-out infinite; }
      @keyframes rock {
        0%, 100% { transform: rotate(-2.5deg); }
        50% { transform: rotate(2.5deg); }
      }

      .m-sway { animation: sway 1.8s ease-in-out infinite; }
      @keyframes sway {
        0%, 100% { transform: translateX(-5px) rotate(-1deg); }
        50% { transform: translateX(5px) rotate(1deg); }
      }

      .m-jitter { animation: jitter 0.2s steps(2) infinite; }
      @keyframes jitter {
        0% { transform: translateY(0); }
        100% { transform: translateY(-1px); }
      }

      .m-wave { animation: wave 0.9s ease-in-out infinite; }
      @keyframes wave {
        0%, 100% { transform: translateY(0) rotate(0); }
        20% { transform: translateY(-10px) rotate(-5deg); }
        40% { transform: translateY(0) rotate(4deg); }
        60% { transform: translateY(-6px) rotate(-3deg); }
        80% { transform: translateY(0) rotate(2deg); }
      }

      .m-jump { animation: jump 1.2s cubic-bezier(0.3, 0, 0.3, 1) infinite; }
      @keyframes jump {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        15% { transform: translateY(0) scale(1.08, 0.92); }
        45% { transform: translateY(-26px) scale(0.96, 1.05); }
        75% { transform: translateY(0) scale(1.05, 0.95); }
        88% { transform: translateY(0) scale(1, 1); }
      }

      .m-stretch { animation: stretch 1s cubic-bezier(0.3, 0, 0.3, 1) infinite; transform-origin: var(--pivot-x, 50%) var(--pivot-y, 100%); }
      @keyframes stretch {
        0%, 100% { transform: scaleY(1); }
        30% { transform: scaleY(1.1); }
        55% { transform: scaleY(0.96); }
        78% { transform: scaleY(1.02); }
      }

      .m-shake { animation: shake 1.6s linear infinite; }

      .m-shake-once { animation: shake 1.6s linear 1; }
      @keyframes shake {
        0%, 30%, 100% { transform: translateX(0); }
        5%, 15%, 25% { transform: translateX(-3px); }
        10%, 20% { transform: translateX(3px); }
      }

      .m-snore { animation: snore 4s ease-in-out infinite; }
      @keyframes snore {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 1.05); }
      }

      .m-bat { animation: bat 1s ease-in-out infinite; }
      @keyframes bat {
        0%, 100% { transform: translateX(0) rotate(0); }
        30% { transform: translateX(-6px) rotate(-4deg); }
        60% { transform: translateX(3px) rotate(2deg); }
      }

      #pet.m-dangle {

        transform-origin: var(--grab-origin-x, 50%) var(--grab-origin-y, 15%);
      }

      .m-trot { animation: trot 0.33s ease-in-out infinite; }
      @keyframes trot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </head>

  <body>

    <div id="stage">
      <div id="pet">

        <div id="pet-art" hidden>

          <div id="pet-shadow-wrap" hidden>
            <img id="pet-shadow" alt="" draggable="false" />
          </div>
          <img id="pet-img" alt="" draggable="false" />

          <div id="pet-overlay" class="pet-fx" hidden></div>
          <div id="pet-overlay2" class="pet-fx" hidden></div>
          <div id="pet-overlay3" class="pet-fx" hidden></div>

          <div id="pet-rig" hidden>
            <div id="rig-Tail1-node" class="rig-tail-node">
              <img id="rig-Tail1" alt="" draggable="false" />
              <div id="rig-Tail2-node" class="rig-tail-node">
                <img id="rig-Tail2" alt="" draggable="false" />
                <div id="rig-Tail3-node" class="rig-tail-node">
                  <img id="rig-Tail3" alt="" draggable="false" />
                  <div id="rig-Tail4-node" class="rig-tail-node">
                    <img id="rig-Tail4" alt="" draggable="false" />
                  </div>
                </div>
              </div>
            </div>
            <img id="rig-body" alt="" draggable="false" />
            <img id="rig-earL" alt="" draggable="false" />
            <img id="rig-earR" alt="" draggable="false" />
            <img id="rig-face" alt="" draggable="false" />
            <img id="rig-EyelidTL" alt="" draggable="false" hidden />
            <img id="rig-EyelidTR" alt="" draggable="false" hidden />
            <img id="rig-EyelidBL" alt="" draggable="false" hidden />
            <img id="rig-EyelidBR" alt="" draggable="false" hidden />
          </div>
        </div>

        <div id="pet-emoji" hidden>🐱</div>
      </div>

      <div id="bottom-row">
        <div id="label"><span id="label-text"></span><span id="label-count" hidden></span></div>

        <div id="skin-hint" hidden></div>
      </div>

      <div id="bubble" hidden>
        <div id="bubble-text"></div>

        <button id="bubble-paw" type="button"><img src="assets/ui/icon_catpaw.png" alt="" draggable="false" /></button>
        <div id="bubble-body" hidden></div>
      </div>
    </div>
    <script src="status.js"></script>
    <script src="folder-names.js"></script>
    <script src="pet.js"></script>

    <script src="ds-price.js"></script>
    <script src="ds-badge.js"></script>
  </body>
</html>
